<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Brew Bar: order your iced latte, croissant or matcha ahead and pick it up in five minutes." />
  <meta name="theme-color" content="#f3ead8" />
  <title>Brew Bar · order ahead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot" aria-hidden="true"></span> Brew Bar</div>
    <span class="tag">order ahead · pick up in 5 min</span>
  </header>

  <main class="layout">
    <section class="menu" aria-label="Menu">
      <h1>What are we drinking?</h1>
      <ul class="items" id="menu">
        <li class="item item--latte">
          <span class="swatch" aria-hidden="true"><svg class="ill" focusable="false" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#2a1a10" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M36 4 L30 22" stroke-width="3"/><path d="M36 4 L30 22" stroke="#f26b2a" stroke-width="1.2"/><path d="M18 18 H46 L42 58 H22 Z" fill="#fffaf0"/><path d="M19.6 34 H44.4 L42 58 H22 Z" fill="#b97a4a" stroke="none"/><path d="M19.1 28 H44.9 L44.4 34 H19.6 Z" fill="#f1dcc0" stroke="none"/><path d="M19.6 34 Q32 31 44.4 34" stroke="#2a1a10" stroke-width="1.2" opacity=".5"/><rect x="24" y="22" width="8" height="8" rx="2" fill="#ffffff" stroke-width="1.6" transform="rotate(-12 28 26)"/><rect x="33" y="24" width="7" height="7" rx="2" fill="#ffffff" stroke-width="1.6" transform="rotate(14 36 27)"/><rect x="27" y="38" width="7" height="7" rx="2" fill="#ffffff" fill-opacity=".55" stroke-width="1.4" transform="rotate(8 30 41)"/><path d="M18 18 H46 L42 58 H22 Z"/><path d="M40 22 L38 52" stroke="#ffffff" stroke-width="2" opacity=".7"/></svg></span>
          <div class="info"><h2>Iced Latte</h2><p>double shot, oat milk</p></div>
          <span class="price">$4.50</span>
          <button class="add" data-name="Iced Latte" data-price="4.50">Add Iced Latte</button>
        </li>
        <li class="item item--croissant">
          <span class="swatch" aria-hidden="true"><svg class="ill" focusable="false" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#2a1a10" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 40 C4 30 10 26 14 28 L18 34 Z" fill="#e8a33c"/><path d="M58 40 C60 30 54 26 50 28 L46 34 Z" fill="#e8a33c"/><path d="M14 28 C16 20 22 18 24 22 L26 36 L18 34 Z" fill="#f2b84b"/><path d="M50 28 C48 20 42 18 40 22 L38 36 L46 34 Z" fill="#f2b84b"/><path d="M24 22 C26 12 38 12 40 22 L38 36 Q32 39 26 36 Z" fill="#f7c95e"/><path d="M6 40 Q32 54 58 40 L46 34 Q32 40 18 34 Z" fill="#d98a2b"/><path d="M27 19 Q32 16 37 19" stroke="#fff3cf" stroke-width="2"/><path d="M16 25 Q18 23 20 24" stroke="#fff3cf" stroke-width="1.8"/></svg></span>
          <div class="info"><h2>Butter Croissant</h2><p>baked this morning</p></div>
          <span class="price">$3.00</span>
          <button class="add" data-name="Butter Croissant" data-price="3.00">Add Butter Croissant</button>
        </li>
        <li class="item item--matcha">
          <span class="swatch" aria-hidden="true"><svg class="ill" focusable="false" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#2a1a10" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 30 Q11 18 22 18 Q24 10 33 12 Q40 6 46 14 Q55 14 53 26 Q54 30 52 30 Z" fill="#ffffff"/><path d="M24 22 Q28 19 32 22" stroke-width="1.4" opacity=".55"/><path d="M38 19 Q42 17 45 20" stroke-width="1.4" opacity=".55"/><path d="M10 30 H54 L50 54 Q49 58 45 58 H19 Q15 58 14 54 Z" fill="#6aa84f"/><path d="M10 30 H54 L53.2 35 H10.8 Z" fill="#e9f3d6"/><path d="M54 36 Q62 36 60 44 Q58 50 51 49" fill="none"/><path d="M10 30 H54 L50 54 Q49 58 45 58 H19 Q15 58 14 54 Z"/><path d="M20 40 Q21 48 24 52" stroke="#d6ebbf" stroke-width="2"/></svg></span>
          <div class="info"><h2>Matcha Cloud</h2><p>ceremonial grade, foam top</p></div>
          <span class="price">$5.25</span>
          <button class="add" data-name="Matcha Cloud" data-price="5.25">Add Matcha Cloud</button>
        </li>
      </ul>
    </section>

    <aside class="cart" aria-label="Your order">
      <h2>Your order</h2>
      <ul id="cart-lines" class="lines"><li class="empty">Nothing yet.</li></ul>
      <div class="total-row">
        <span>Total</span>
        <strong id="cart-total" data-testid="cart-total">$0.00</strong>
      </div>
      <button id="checkout" class="checkout" disabled>Place order</button>
      <p id="status" class="status" role="status"></p>
    </aside>
  </main>

  <script src="cart.js"></script>
</body>
</html>
